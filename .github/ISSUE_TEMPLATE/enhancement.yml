name: Feature or maintenance request
description: Propose an API improvement, documentation change or repository maintenance.
labels: [enhancement]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: Describe the user problem or maintenance need.
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Details
      description: Explain use cases, the proposed approach, alternatives and compatibility constraints. Link relevant contracts or issues.
    validations:
      required: true
  - type: textarea
    id: expected-outcome
    attributes:
      label: Expected outcome
      description: State concrete acceptance criteria and any intended exclusions.
    validations:
      required: true
