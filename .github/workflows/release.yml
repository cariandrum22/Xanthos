name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Source version to release (without v prefix, e.g., 0.3.0)'
        required: true
        type: string

permissions:
  contents: read

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true

jobs:
  build-and-test:
    name: Build and Test
    runs-on: windows-latest
    outputs:
      version: ${{ steps.release-metadata.outputs.version }}
    env:
      XANTHOS_E2E_MODE: STUB
      XANTHOS_E2E_SID: CI_TEST_SID
      XANTHOS_E2E_SERVICE_KEY: CI_TEST_KEY
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@v6.0.0
        with:
          global-json-file: global.json

      - name: Verify source version, release notes and tag signature
        id: release-metadata
        shell: pwsh
        env:
          REQUESTED_VERSION: ${{ github.event.inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') {
            $env:REQUESTED_VERSION
          } else {
            $env:GITHUB_REF -replace '^refs/tags/v', ''
          }
          ./scripts/assert-release-version.ps1 -RequestedVersion $version
          $sourceCommit = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0) {
            throw 'Cannot resolve the checked-out release commit.'
          }
          python scripts/release_notes.py --version $version --verify-tag --repository $env:GITHUB_REPOSITORY --commit $sourceCommit
          if ($LASTEXITCODE -ne 0) {
            throw 'Release metadata validation failed.'
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Restore dependencies
        run: dotnet restore

      - name: Build solution
        run: dotnet build --no-restore --configuration Release

      - name: Run required release test profiles
        shell: pwsh
        run: |
          ./scripts/run-test-profile.ps1 -Profile Fast -RunId "release-${{ github.run_id }}-${{ github.run_attempt }}" -NoBuild
          ./scripts/run-test-profile.ps1 -Profile Coverage -RunId "release-${{ github.run_id }}-${{ github.run_attempt }}" -NoBuild
          ./scripts/run-test-profile.ps1 -Profile WindowsManaged -RunId "release-${{ github.run_id }}-${{ github.run_attempt }}" -RequireSdkAbsent

      - name: Retain release test evidence
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: release-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          overwrite: true
          path: .artifacts/test-quality/release-${{ github.run_id }}-${{ github.run_attempt }}/
          include-hidden-files: true
          if-no-files-found: error

  publish:
    name: Publish to NuGet
    runs-on: windows-latest
    needs: build-and-test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@v6.0.0
        with:
          global-json-file: global.json

      - name: Restore dependencies
        run: dotnet restore

      - name: Pack both target frameworks at the source version
        run: dotnet pack src/Xanthos/Xanthos.fsproj --configuration Release --output ./nupkg

      - name: Upload NuGet package artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: nuget-package
          overwrite: true
          path: ./nupkg/*.nupkg
          retention-days: 7

      - name: Publish to NuGet.org
        shell: bash
        run: dotnet nuget push ./nupkg/*.nupkg --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-and-test, publish]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Download NuGet package
        uses: actions/download-artifact@v8.0.1
        with:
          name: nuget-package
          path: ./nupkg

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3.0.3
        with:
          name: v${{ needs.build-and-test.outputs.version }}
          body_path: docs/releases/v${{ needs.build-and-test.outputs.version }}.md
          generate_release_notes: false
          fail_on_unmatched_files: true
          files: ./nupkg/*.nupkg
