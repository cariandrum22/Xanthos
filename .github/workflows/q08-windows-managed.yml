name: Q08 Windows managed verification

on:
  workflow_dispatch:
  pull_request:
    branches: [develop, 'feat/sdk5-functional-x64']
  push:
    branches: ['verification/q08-*']

permissions:
  contents: read

jobs:
  windows-managed:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Verify SDK absence and run Windows x64 boundaries
        shell: pwsh
        run: ./scripts/run-windows-managed-ci.ps1 -RunId "q08-${{ github.run_id }}-${{ github.run_attempt }}"
      - name: Preserve Q08 environment, invocation and TRX
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: q08-windows-managed
          path: .artifacts/test-quality/q08-${{ github.run_id }}-${{ github.run_attempt }}/windows/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
