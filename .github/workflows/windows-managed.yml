name: Windows x64 managed verification

on:
  workflow_dispatch:
  push:
    branches: ['verification/windows-managed-*']

permissions:
  contents: read

jobs:
  windows-managed:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-dotnet@v6.0.0
        with:
          global-json-file: global.json
      - name: Verify SDK absence and run Windows x64 boundaries
        shell: pwsh
        run: ./scripts/run-windows-managed-ci.ps1 -RunId "windows-managed-${{ github.run_id }}-${{ github.run_attempt }}"
      - name: Preserve Windows environment, invocation and TRX
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: windows-managed
          overwrite: true
          path: .artifacts/test-quality/windows-managed-${{ github.run_id }}-${{ github.run_attempt }}/windows/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
