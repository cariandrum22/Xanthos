name: CI

on:
  workflow_dispatch:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true
  XANTHOS_E2E_MODE: STUB
  XANTHOS_E2E_SID: CI_TEST_SID
  XANTHOS_E2E_SERVICE_KEY: CI_TEST_KEY

jobs:
  build-and-test:
    name: Build and Test (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # StubX64 verifies x64 explicitly; macos-latest is an arm64 image.
        os: [ubuntu-latest, macos-26-intel, windows-latest]
        include:
          - os: ubuntu-latest
            platform: linux
          - os: macos-26-intel
            platform: macos
          - os: windows-latest
            platform: windows

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@v6.0.0
        with:
          global-json-file: global.json

      - name: Display .NET info
        run: dotnet --info

      - name: Restore dependencies
        run: dotnet restore

      - name: Build solution
        run: dotnet build --no-restore --configuration Release

      - name: Verify evidence validators reject controlled faults
        if: runner.os == 'Linux'
        shell: pwsh
        run: |
          ./scripts/test-evidence-validators.ps1 -RunId "controls-${{ github.run_id }}-${{ github.run_attempt }}"
          dotnet fsi ./scripts/test-settings-workflow.fsx
          ./scripts/test-coverage-badge.ps1

      - name: Run required Fast suites
        shell: pwsh
        run: ./scripts/run-test-profile.ps1 -Profile Fast -RunId "ci-${{ github.run_id }}" -NoBuild

      - name: Run required managed coverage suites
        shell: pwsh
        run: ./scripts/run-test-profile.ps1 -Profile Coverage -RunId "ci-${{ github.run_id }}" -NoBuild

      - name: Run Windows x64 managed boundaries without JV-Link
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/run-test-profile.ps1 -Profile WindowsManaged -RunId "ci-${{ github.run_id }}" -RequireSdkAbsent

      - name: Upload complete evidence and diagnostics
        uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: quality-${{ matrix.platform }}
          overwrite: true
          path: .artifacts/test-quality/ci-${{ github.run_id }}/${{ matrix.platform }}/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error

      - name: Upload test logs (on failure)
        uses: actions/upload-artifact@v7.0.1
        if: failure()
        with:
          name: test-logs-${{ matrix.platform }}
          overwrite: true
          path: .artifacts/cli-e2e/test-logs/
          retention-days: 7
          if-no-files-found: ignore

  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@v6.0.0
        with:
          global-json-file: global.json

      - name: Restore dependencies
        run: dotnet restore

      - name: Restore .NET tools
        run: dotnet tool restore

      - name: Check formatting (fantomas)
        run: dotnet fantomas --check .

      - name: Lint (fsharplint)
        run: dotnet fsharplint lint Xanthos.sln
        timeout-minutes: 20

  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [build-and-test]
    if: always()
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Download OS artifacts into separate directories
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: quality-*
          path: ./QualityArtifacts
          merge-multiple: false

      - name: Verify every required run, case and coverage report
        shell: pwsh
        run: |
          ./scripts/assert-ci-artifacts.ps1 -ArtifactsDirectory QualityArtifacts -RunId "ci-${{ github.run_id }}" -Commit '${{ github.sha }}' -JobResult '${{ needs.build-and-test.result }}' -RunAttempt ${{ github.run_attempt }}
          'All required Fast, Coverage and WindowsManaged evidence passed. OptionalFixtures, Com, Interactive and Live were not run by CI.' >> $env:GITHUB_STEP_SUMMARY

      - name: Preserve verified artifact manifest
        uses: actions/upload-artifact@v7.0.1
        with:
          name: quality-manifest
          overwrite: true
          path: QualityArtifacts/artifact-manifest.json
          if-no-files-found: error

      - name: Generate managed line coverage badge
        shell: pwsh
        run: >-
          ./scripts/new-coverage-badge.ps1 -ReportsDirectory QualityArtifacts/quality-linux/net10.0/Coverage
          -Assembly Xanthos -SourcePrefix src/Xanthos -ExpectedReports 3
          -Commit '${{ github.sha }}' -RunUrl '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
          -OutputDirectory .github/badges

      - name: Preserve measured coverage badge
        uses: actions/upload-artifact@v7.0.1
        with:
          name: coverage-badge
          path: .github/badges/
          include-hidden-files: true
          if-no-files-found: error

      - name: Summarize managed line coverage
        shell: pwsh
        run: |
          $coverage = Get-Content .github/badges/coverage.json -Raw | ConvertFrom-Json
          "Managed line coverage: $($coverage.percentage)% ($($coverage.coveredLines)/$($coverage.totalLines)). Linux Coverage suites only; native COM execution excluded." >> $env:GITHUB_STEP_SUMMARY

  publish-coverage-badge:
    name: Publish coverage badge
    needs: [test-summary, code-quality]
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v8.0.1
        with:
          name: coverage-badge
          path: .github/badges
      - name: Refresh generated badges on develop
        shell: pwsh
        run: ./scripts/publish-coverage-badge.ps1 -Branch develop -SourceCommit '${{ github.sha }}'

  docs:
    name: Build Documentation
    runs-on: ubuntu-latest
    needs: [build-and-test]
    if: github.event_name == 'push'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@v6.0.0
        with:
          global-json-file: global.json

      - name: Restore dependencies
        run: dotnet restore

      - name: Restore .NET tools
        run: dotnet tool restore

      - name: Build solution
        run: dotnet build --configuration Release

      - name: Generate documentation
        run: >-
          dotnet fsdocs build --clean --properties Configuration=Release
          --parameters
          fsdocs-root /Xanthos/
          fsdocs-logo-src img/logo.png
          fsdocs-favicon-src img/favicon.png
          fsdocs-license-link https://github.com/cariandrum22/Xanthos/blob/main/LICENSE
          fsdocs-release-notes-link https://github.com/cariandrum22/Xanthos/releases
          fsdocs-repository-link https://github.com/cariandrum22/Xanthos

      - name: Upload documentation artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: documentation
          overwrite: true
          path: output/
          retention-days: 7

      - name: Setup Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v6.0.0
        with:
          enablement: true

      - name: Upload to GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: output/

  deploy-docs:
    name: Deploy Documentation
    runs-on: ubuntu-latest
    needs: docs
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
